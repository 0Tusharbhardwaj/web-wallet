<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🪙 Simple Ethereum Web Wallet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🪙 Simple Ethereum Wallet</h1>

  <button onclick="generateMnemonic()">Generate Mnemonic</button>
  <p id="mnemonicDisplay"></p>

  <button onclick="addWallet()">Add Wallet</button>
  <div id="wallets"></div>

  <!-- ✅ Ethers.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

  <!-- ✅ Wallet Logic -->
  <script>
    let mnemonic = '';
    let walletIndex = 0;

    function generateMnemonic() {
      const randomWallet = ethers.Wallet.createRandom();
      mnemonic = randomWallet.mnemonic.phrase;
      document.getElementById('mnemonicDisplay').innerText = `Mnemonic: ${mnemonic}`;
      walletIndex = 0;
      document.getElementById('wallets').innerHTML = '';
    }

    function addWallet() {
      if (!mnemonic) {
        alert("Generate a mnemonic first!");
        return;
      }

      const path = `m/44'/60'/0'/0/${walletIndex}`;
      const wallet = ethers.Wallet.fromMnemonic(mnemonic, path);

      const walletDiv = document.createElement('div');
      walletDiv.className = 'wallet';
      walletDiv.innerHTML = `
        <strong>Wallet ${walletIndex + 1}</strong><br>
        Public Address: ${wallet.address}
      `;
      document.getElementById('wallets').appendChild(walletDiv);
      walletIndex++;
    }
  </script>

</body>
</html>
